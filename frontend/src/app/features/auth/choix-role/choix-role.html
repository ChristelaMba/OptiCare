<main class="w-full min-h-screen grid grid-cols-1 md:grid-cols-2">
  <!-- Colonne gauche : image (desktop uniquement).
       TODO : auth-connexion.jpg et auth-inscription.jpg sont actuellement
       le même fichier (placeholders identiques) — prévoir des visuels
       distincts par écran plus tard. Voir JOURNAL-MODIFICATIONS-PARTAGEES.md. -->
  <div class="hidden md:block relative h-full overflow-hidden">
    <!-- Image posée en background-image, chargée uniquement à partir de md :
         un <img> se charge toujours même caché par display:none, alors
         qu'un background-image déclaré dans une règle md: ne l'est que si
         le media query correspond — évite ~80 Ko inutiles sur mobile. -->
    <div
      class="absolute inset-0 bg-cover bg-center md:bg-[url('/images/auth-inscription.jpg')]"
      aria-hidden="true"
    ></div>
    <div class="absolute inset-0 bg-primary/10"></div>
  </div>

  <!-- Colonne droite : choix -->
  <div class="relative overflow-hidden flex items-center justify-center p-margin-mobile md:p-space-12 bg-surface-bg">
    <!-- Ambiance décorative (verre dépoli, 04/09) : sans ce fond, le flou de
         la carte n'a rien à flouter sur cette colonne quasi unie. -->
    <div class="absolute -top-32 -left-24 w-80 h-80 bg-primary/8 rounded-full blur-3xl pointer-events-none" aria-hidden="true"></div>
    <div class="absolute -bottom-32 -right-16 w-72 h-72 bg-secondary/10 rounded-full blur-3xl pointer-events-none" aria-hidden="true"></div>

    <div class="w-full max-w-[500px] relative z-10">
      <!-- Carte choix du rôle — verre dépoli léger (04/09) : carte
           translucide + flou d'arrière-plan, contenu texte non affecté
           (pas de champ de saisie sur cet écran). -->
      <div class="auth-card-enter bg-surface-container-lowest/80 backdrop-blur-xl border border-white/60 rounded-xl shadow-md p-space-8 md:p-space-12 relative overflow-hidden">
        <div class="absolute -top-24 -right-24 w-48 h-48 bg-primary/5 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Logo (déplacé à l'intérieur du cadre, 04/09) -->
        <div class="text-center mb-space-8 relative z-10">
          <h1 class="flex items-center justify-center">
            <img src="/images/logo-opticare.png" alt="OptiCare" class="h-10 w-auto" />
          </h1>
        </div>

        <div class="mb-space-6 relative z-10">
          <span class="block font-body text-label-sm font-bold uppercase tracking-widest text-primary mb-2">Étape 1 sur 2</span>
          <h2 class="font-heading text-headline-h2 text-on-surface font-bold mb-2">Rejoindre OptiCare</h2>
          <p class="font-body text-body-base text-text-muted">Comment souhaitez-vous vous inscrire ?</p>
        </div>

        <div class="space-y-space-4 relative z-10">
          <!-- Option Patient -->
          <a
            routerLink="/auth/inscription/patient"
            class="group flex items-center gap-space-4 p-space-4 rounded-lg border border-border-subtle hover:border-primary hover:bg-primary/5 hover:shadow-sm hover:-translate-y-px transition-all focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2"
          >
            <span class="material-symbols-outlined text-primary text-[28px]">person</span>
            <div class="flex-1">
              <h3 class="font-heading text-headline-h3 text-on-surface">Je suis un patient</h3>
              <p class="font-body text-body-base text-text-muted">Accédez à vos consultations et prenez rendez-vous.</p>
            </div>
            <span class="material-symbols-outlined text-text-muted group-hover:text-primary transition-colors">arrow_forward</span>
          </a>

          <!-- Option Cabinet -->
          <a
            routerLink="/auth/inscription/cabinet"
            class="group flex items-center gap-space-4 p-space-4 rounded-lg border border-border-subtle hover:border-primary hover:bg-primary/5 hover:shadow-sm hover:-translate-y-px transition-all focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2"
          >
            <span class="material-symbols-outlined text-primary text-[28px]">storefront</span>
            <div class="flex-1">
              <h3 class="font-heading text-headline-h3 text-on-surface">Je suis un cabinet</h3>
              <p class="font-body text-body-base text-text-muted">Inscrivez votre cabinet et gérez votre activité.</p>
            </div>
            <span class="material-symbols-outlined text-text-muted group-hover:text-primary transition-colors">arrow_forward</span>
          </a>
        </div>

        <div class="mt-space-6 text-center relative z-10">
          <p class="font-body text-body-base text-on-surface-variant">
            Déjà un compte ?
            <a routerLink="/auth/connexion" class="text-primary font-semibold hover:text-tertiary-container transition-colors ml-1 rounded-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2">Se connecter</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</main>
