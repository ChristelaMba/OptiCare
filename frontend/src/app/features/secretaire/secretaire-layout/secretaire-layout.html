<div class="secretaire-layout">

  <!-- OVERLAY MOBILE -->

  @if (menuOuvert()) {

    <div
      class="sidebar-overlay"
      (click)="fermerMenu()"
    ></div>

  }


  <!-- =====================================================
       SIDEBAR
  ====================================================== -->

  <aside
    class="sidebar"
    [class.sidebar-open]="menuOuvert()"
  >

    <!-- BRAND -->

    <div class="sidebar-brand">

      <a
        routerLink="/secretaire/agenda"
        class="brand"
        (click)="fermerMenu()"
      >

        <div class="brand-icon">

          <i class="fa-solid fa-eye"></i>

        </div>

        <div class="brand-text">

          <strong>
            OptiCare
          </strong>

          <span>
            Espace secrétaire
          </span>

        </div>

      </a>


      <button
        type="button"
        class="close-menu"
        (click)="fermerMenu()"
        aria-label="Fermer le menu"
      >

        <i class="fa-solid fa-xmark"></i>

      </button>

    </div>


    <!-- =================================================
         SÉLECTEUR D'ESPACE
    ================================================== -->

    <div class="workspace-selector">

      <button
        type="button"
        class="workspace-button"
        [class.open]="espaceOuvert()"
        (click)="toggleEspace()"
      >

        <span class="workspace-icon secretary">

          <i class="fa-solid fa-user-tie"></i>

        </span>

        <span class="workspace-info">

          <small>
            ESPACE ACTUEL
          </small>

          <strong>
            Secrétaire
          </strong>

        </span>

        <i
          class="fa-solid fa-chevron-down workspace-arrow"
        ></i>

      </button>


      @if (espaceOuvert()) {

        <div class="workspace-menu">

          <!-- PATIENT -->

          <a
            routerLink="/patient"
            class="workspace-option"
            (click)="fermerEspace(); fermerMenu()"
          >

            <span class="option-icon patient">

              <i class="fa-regular fa-user"></i>

            </span>

            <span class="option-content">

              <strong>
                Espace patient
              </strong>

              <small>
                Votre espace personnel
              </small>

            </span>

          </a>


          <!-- SECRÉTAIRE -->

          <a
            routerLink="/secretaire/agenda"
            class="workspace-option active"
            (click)="fermerEspace(); fermerMenu()"
          >

            <span class="option-icon secretary">

              <i class="fa-solid fa-user-tie"></i>

            </span>

            <span class="option-content">

              <strong>
                Espace secrétaire
              </strong>

              <small>
                Gestion du cabinet
              </small>

            </span>

            <i class="fa-solid fa-check"></i>

          </a>

        </div>

      }

    </div>


    <!-- =================================================
         NAVIGATION
    ================================================== -->

    <nav class="sidebar-nav">

      <span class="nav-label">
        MENU PRINCIPAL
      </span>


      <a
        routerLink="/secretaire/agenda"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-item"
        (click)="fermerMenu()"
      >

        <span class="nav-icon">

          <i class="fa-regular fa-calendar-days"></i>

        </span>

        <span>
          Agenda
        </span>

      </a>


      <a
        routerLink="/secretaire/enregistrement-patient"
        routerLinkActive="active"
        class="nav-item"
        (click)="fermerMenu()"
      >

        <span class="nav-icon">

          <i class="fa-solid fa-user-plus"></i>

        </span>

        <span>
          Enregistrer un patient
        </span>

      </a>

    </nav>


    <!-- =================================================
         BAS
    ================================================== -->

    <div class="sidebar-bottom">

      <button
        type="button"
        class="help-card"
      >

        <span class="help-icon">

          <i class="fa-regular fa-circle-question"></i>

        </span>

        <span class="help-content">

          <strong>
            Besoin d'aide ?
          </strong>

          <small>
            Contacter OptiCare
          </small>

        </span>

      </button>


      <div class="user-card">

        <div class="avatar">
          MD
        </div>

        <div class="user-info">

          <strong>
            Marie Dupont
          </strong>

          <span>
            Secrétaire
          </span>

        </div>

        <button
          type="button"
          class="user-more"
        >

          <i class="fa-solid fa-ellipsis"></i>

        </button>

      </div>

    </div>

  </aside>


  <!-- =====================================================
       MAIN
  ====================================================== -->

  <main class="main-content">

    <!-- TOPBAR -->

    <header class="topbar">

      <button
        type="button"
        class="mobile-menu-button"
        (click)="toggleMenu()"
        aria-label="Ouvrir le menu"
      >

        <i class="fa-solid fa-bars"></i>

      </button>


      <div class="topbar-title">

        <span>
          Espace secrétaire
        </span>

      </div>


      <div class="topbar-actions">

        <div class="search-top">

          <i class="fa-solid fa-magnifying-glass"></i>

          <input
            type="text"
            placeholder="Rechercher..."
          />

        </div>


        <button
          type="button"
          class="notification-button"
        >

          <i class="fa-regular fa-bell"></i>

          <span class="notification-dot"></span>

        </button>


        <div class="top-avatar">
          MD
        </div>

      </div>

    </header>


    <!-- CONTENU -->

    <div class="page-content">

      <router-outlet></router-outlet>

    </div>

  </main>

</div>
