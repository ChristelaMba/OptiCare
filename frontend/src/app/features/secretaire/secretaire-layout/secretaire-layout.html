<div
  class="secretaire-layout"
  [class.dark-mode]="modeSombre()"
>

  <!-- =====================================================
       OVERLAY MOBILE
  ====================================================== -->

  @if (menuOuvert()) {

    <div
      class="sidebar-overlay"
      (click)="fermerMenu()"
    ></div>

  }


  <!-- =====================================================
       SIDEBAR
  ====================================================== -->

  <aside
    class="sidebar"
    [class.sidebar-open]="menuOuvert()"
  >

    <!-- ===================================================
         BRAND
    ==================================================== -->

    <div class="sidebar-brand">

      <a
        routerLink="/secretaire/agenda"
        class="brand"
        (click)="fermerMenu()"
      >

        <div class="brand-icon">

          <svg
            viewBox="0 0 32 32"
            aria-hidden="true"
          >

            <path
              d="M4 16s4.5-7 12-7 12 7 12 7-4.5 7-12 7S4 16 4 16Z"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            />

            <circle
              cx="16"
              cy="16"
              r="3.5"
              fill="currentColor"
            />

          </svg>

        </div>


        <div class="brand-text">

          <strong>
            OptiCare
          </strong>

          <span>
            Espace secrétaire
          </span>

        </div>

      </a>


      <button
        type="button"
        class="close-menu"
        (click)="fermerMenu()"
        aria-label="Fermer le menu"
      >

        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            d="M6 6l12 12M18 6 6 18"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>

      </button>

    </div>


    <!-- ===================================================
         SÉLECTEUR D'ESPACE
    ==================================================== -->

    <div class="workspace-selector">

      <button
        type="button"
        class="workspace-button"
        [class.open]="espaceOuvert()"
        (click)="toggleEspace()"
      >

        <span class="workspace-icon secretary">

          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >

            <circle
              cx="12"
              cy="8"
              r="3"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
            />

            <path
              d="M5 20c.7-3.5 3-5.5 7-5.5s6.3 2 7 5.5"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
            />

          </svg>

        </span>


        <span class="workspace-info">

          <small>
            ESPACE ACTUEL
          </small>

          <strong>
            Secrétaire
          </strong>

        </span>


        <svg
          class="workspace-arrow"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >

          <path
            d="m7 10 5 5 5-5"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />

        </svg>

      </button>


      @if (espaceOuvert()) {

        <div class="workspace-menu">

          <!-- PATIENT -->

          <a
            routerLink="/patient"
            class="workspace-option"
            (click)="fermerEspace(); fermerMenu()"
          >

            <span class="option-icon patient">

              <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
              >

                <circle
                  cx="12"
                  cy="8"
                  r="3"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                />

                <path
                  d="M5 20c.7-3.5 3-5.5 7-5.5s6.3 2 7 5.5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                />

              </svg>

            </span>


            <span class="option-content">

              <strong>
                Espace patient
              </strong>

              <small>
                Votre espace personnel
              </small>

            </span>

          </a>


          <!-- SECRÉTAIRE -->

          <a
            routerLink="/secretaire/agenda"
            class="workspace-option active"
            (click)="fermerEspace(); fermerMenu()"
          >

            <span class="option-icon secretary">

              <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
              >

                <circle
                  cx="12"
                  cy="8"
                  r="3"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                />

                <path
                  d="M5 20c.7-3.5 3-5.5 7-5.5s6.3 2 7 5.5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                />

              </svg>

            </span>


            <span class="option-content">

              <strong>
                Espace secrétaire
              </strong>

              <small>
                Gestion du cabinet
              </small>

            </span>


            <svg
              class="check-icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >

              <path
                d="m5 12 4 4L19 6"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />

            </svg>

          </a>

        </div>

      }

    </div>


    <!-- ===================================================
         NAVIGATION
    ==================================================== -->

    <nav class="sidebar-nav">

      <span class="nav-label">
        MENU PRINCIPAL
      </span>


      <!-- AGENDA -->

      <a
        routerLink="/secretaire/agenda"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-item"
        (click)="fermerMenu()"
      >

        <span class="nav-icon">

          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >

            <rect
              x="4"
              y="5"
              width="16"
              height="15"
              rx="2"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
            />

            <path
              d="M8 3v4M16 3v4M4 10h16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
            />

          </svg>

        </span>

        <span>
          Agenda
        </span>

      </a>


      <!-- ENREGISTRER PATIENT -->

      <a
        routerLink="/secretaire/enregistrement-patient"
        routerLinkActive="active"
        class="nav-item"
        (click)="fermerMenu()"
      >

        <span class="nav-icon">

          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >

            <circle
              cx="9"
              cy="8"
              r="3"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
            />

            <path
              d="M3.5 19c.7-3.3 2.7-5 5.5-5 2.8 0 4.8 1.7 5.5 5"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
            />

            <path
              d="M17 8v6M14 11h6"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
            />

          </svg>

        </span>

        <span>
          Enregistrer un patient
        </span>

      </a>

    </nav>


    <!-- ===================================================
         BAS SIDEBAR
    ==================================================== -->

    <div class="sidebar-bottom">


      <!-- AIDE -->

      <button
        type="button"
        class="help-card"
      >

        <span class="help-icon">

          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >

            <circle
              cx="12"
              cy="12"
              r="9"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
            />

            <path
              d="M9.5 9a2.5 2.5 0 1 1 4.3 1.8c-.9.8-1.8 1.2-1.8 2.7"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
            />

            <circle
              cx="12"
              cy="17"
              r="0.8"
              fill="currentColor"
            />

          </svg>

        </span>


        <span class="help-content">

          <strong>
            Besoin d'aide ?
          </strong>

          <small>
            Contacter OptiCare
          </small>

        </span>

      </button>


      <!-- UTILISATEUR -->

      <div class="user-card">

        <div class="avatar">
          MD
        </div>


        <div class="user-info">

          <strong>
            Marie Dupont
          </strong>

          <span>
            Secrétaire
          </span>

        </div>


        <button
          type="button"
          class="user-more"
          aria-label="Plus d'options"
        >

          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >

            <circle
              cx="5"
              cy="12"
              r="1.5"
              fill="currentColor"
            />

            <circle
              cx="12"
              cy="12"
              r="1.5"
              fill="currentColor"
            />

            <circle
              cx="19"
              cy="12"
              r="1.5"
              fill="currentColor"
            />

          </svg>

        </button>

      </div>

    </div>

  </aside>


  <!-- =====================================================
       MAIN
  ====================================================== -->

  <main class="main-content">


    <!-- ===================================================
         TOPBAR
    ==================================================== -->

    <header class="topbar">


      <!-- MENU MOBILE -->

      <button
        type="button"
        class="mobile-menu-button"
        (click)="toggleMenu()"
        aria-label="Ouvrir le menu"
      >

        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
        >

          <path
            d="M4 7h16M4 12h16M4 17h16"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />

        </svg>

      </button>


      <!-- TITRE -->

      <div class="topbar-title">

        <span class="topbar-label">
          ESPACE SECRÉTAIRE
        </span>

        <strong>
          Gestion du cabinet
        </strong>

      </div>


      <!-- ACTIONS -->

      <div class="topbar-actions">


        <!-- RECHERCHE -->

        <div class="search-top">

          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >

            <circle
              cx="11"
              cy="11"
              r="6"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
            />

            <path
              d="m16 16 4 4"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
            />

          </svg>


          <input
            type="text"
            placeholder="Rechercher..."
          />

        </div>


        <!-- NOTIFICATIONS -->

        <button
          type="button"
          class="notification-button"
          aria-label="Voir les notifications"
        >

          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >

            <path
              d="M18 9.5a6 6 0 0 0-12 0c0 6.5-2.5 7.5-2.5 9h17c0-1.5-2.5-2.5-2.5-9Z"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
            />

            <path
              d="M9.8 21h4.4"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
            />

          </svg>


          <span class="notification-badge">
            2
          </span>

        </button>


        <!-- MODE SOMBRE / CLAIR -->

        <button
          type="button"
          class="theme-button"
          (click)="toggleTheme()"
          [attr.aria-label]="
            modeSombre()
              ? 'Activer le mode clair'
              : 'Activer le mode sombre'
          "
          [title]="
            modeSombre()
              ? 'Mode clair'
              : 'Mode sombre'
          "
        >

          @if (!modeSombre()) {

            <!-- SOLEIL -->

            <svg
              viewBox="0 0 24 24"
              aria-hidden="true"
            >

              <circle
                cx="12"
                cy="12"
                r="4"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
              />

              <path
                d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
              />

            </svg>

          } @else {

            <!-- LUNE -->

            <svg
              viewBox="0 0 24 24"
              aria-hidden="true"
            >

              <path
                d="M20 15.5A8 8 0 0 1 8.5 4 8.5 8.5 0 1 0 20 15.5Z"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linejoin="round"
              />

            </svg>

          }

        </button>


        <!-- PROFIL -->

        <div class="top-user">

          <div class="top-avatar">
            MD
          </div>

          <div class="top-user-info">

            <strong>
              Marie Dupont
            </strong>

            <span>
              Secrétaire
            </span>

          </div>

        </div>

      </div>

    </header>


    <!-- ===================================================
         CONTENU
    ==================================================== -->

    <div class="page-content">

      <router-outlet></router-outlet>

    </div>

  </main>

</div>
